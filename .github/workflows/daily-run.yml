name: Daily EV Research

on:
  schedule:
    # GitHub Actions cron uses UTC. 02:30 UTC = 08:00 Asia/Kolkata.
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "ev-research-pages"
  cancel-in-progress: false

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TZ: Asia/Kolkata
      AI_PROVIDER: groq
      GROQ_MODEL: openai/gpt-oss-120b
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate exactly two research briefs
        run: python main.py --count 2

      - name: Update dashboard history
        run: python scripts/build_frontend_data.py

      - name: Verify today's run
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("frontend/data/latest.json").read_text())
          assert len(data.get("articles", [])) == 2, "Latest run must contain exactly 2 briefs"
          assert all(a.get("source_url") for a in data["articles"]), "Every brief must contain a source link"
          print("Verified: 2 briefs with source links")
          PY

      - name: Save generated dashboard history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f frontend/data
          if ! git diff --cached --quiet; then
            git commit -m "chore: generate daily EV research briefs"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
